<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172554">
<title>Réinitialisation Devis Électrique V12</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#172554;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px;box-sizing:border-box}.box{max-width:520px;width:100%;background:#fff;border:1px solid #d9e0eb;border-radius:18px;padding:28px;box-shadow:0 18px 50px rgba(23,37,84,.12)}h1{margin:0 0 10px;font-size:24px}.bolt{font-size:34px}.status{margin-top:18px;padding:14px;border-radius:12px;background:#eef3ff}.ok{background:#ecfdf3;color:#166534}.err{background:#fff1f2;color:#991b1b}button{margin-top:16px;width:100%;border:0;border-radius:12px;padding:14px;background:#172554;color:white;font-weight:800;font-size:16px}
</style>
</head>
<body>
<div class="box"><div class="bolt">⚡</div><h1>Réinitialisation Devis Électrique V12</h1><p>Suppression des anciens caches et Service Workers…</p><div id="status" class="status">Nettoyage en cours…</div><button id="go" hidden>Ouvrir l’application</button></div>
<script>
(async()=>{
 const status=document.getElementById('status'),go=document.getElementById('go');
 try{
   if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}
   if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.includes('devis-electrique')).map(k=>caches.delete(k)));}
   try{localStorage.setItem('devis-electrique-cache-reset','v12-20260817-1855')}catch{}
   status.className='status ok';status.textContent='Nettoyage terminé. Ouverture de la version corrigée…';
   const target='./?fresh=v12-20260817-1855';
   setTimeout(()=>location.replace(target),900);
   go.hidden=false;go.onclick=()=>location.replace(target);
 }catch(e){status.className='status err';status.textContent='Le nettoyage automatique a rencontré un problème : '+(e?.message||e);go.hidden=false;go.onclick=()=>location.replace('./?fresh=v12-20260817-1855');}
})();
</script>
</body>
</html>
