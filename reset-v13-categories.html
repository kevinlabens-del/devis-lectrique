<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172554"><title>Actualisation Devis Électrique</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#eef3fb;color:#172554;display:grid;place-items:center;min-height:100vh}.card{width:min(92vw,520px);background:#fff;border-radius:22px;padding:28px;box-shadow:0 18px 50px #0f172a22;border-top:6px solid #f5bf22}h1{margin:0 0 12px;font-size:1.5rem}p{line-height:1.5;color:#475569}.ok{color:#15803d;font-weight:700}.err{color:#b91c1c;font-weight:700}.spin{width:34px;height:34px;border:4px solid #dbe4f0;border-top-color:#172554;border-radius:50%;animation:s 1s linear infinite;margin:18px auto}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><main class="card"><h1>⚡ Mise à jour Devis Électrique</h1><p>Nettoyage de l’ancienne version et chargement du catalogue par catégories…</p><div class="spin"></div><p id="status">Initialisation…</p></main><script>(async()=>{const s=document.getElementById('status');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){await r.unregister();}}if('caches'in window){for(const k of await caches.keys()){if(k.includes('devis-electrique'))await caches.delete(k);}}s.className='ok';s.textContent='Mise à jour terminée. Ouverture de la nouvelle version…';setTimeout(()=>location.replace('./?v=13.1-categories-'+Date.now()),900);}catch(e){s.className='err';s.textContent='Nettoyage partiel. Ouverture forcée…';setTimeout(()=>location.replace('./?v=13.1-categories-'+Date.now()),1200);}})();</script></body></html>
